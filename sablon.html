<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Screening Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --zemin: #0c0910; --yuzey: #17111c; --yuzey2: #221828; --kenar: #3a2840;
    --pembe: #ff5fa8; --pembe-acik: #ffc1dc; --miku: #39c5bb;
    --metin: #fbeef5; --ikincil: #d6b9c9; --soluk: #9c8494;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--zemin); color: var(--metin); overflow: hidden;
    font: 15px/1.5 "M PLUS Rounded 1c", -apple-system, "Segoe UI", sans-serif;
  }
  button, input { font: inherit; color: inherit; }
  .gizli { display: none !important; }

  /* ---------- arka plan: kayan yazilar, kanji, sakura */
  .arka { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .serit-kap { position: absolute; inset: -20% -10%; display: flex; flex-direction: column; justify-content: space-around; transform: rotate(-8deg); }
  .serit { display: flex; width: max-content; animation: kay 60s linear infinite; }
  .serit.ters { animation-direction: reverse; }
  .serit span {
    font-weight: 800; font-size: min(9vw, 110px); line-height: 1; white-space: nowrap; padding-right: .6em;
    color: transparent; -webkit-text-stroke: 1.4px #ff5fa830;
  }
  .serit.miku span { -webkit-text-stroke-color: #39c5bb2a; }
  @keyframes kay { to { transform: translateX(-50%); } }
  .arka .kanji { position: absolute; writing-mode: vertical-rl; font-weight: 800; color: #ff5fa822; font-size: 40px; letter-spacing: .2em; }
  .arka .kanji.sol { left: 18px; top: 40px; }
  .arka .kanji.sag { right: 18px; bottom: 40px; color: #39c5bb24; }
  .yaprak { position: absolute; top: -20px; width: 12px; height: 9px; border-radius: 12px 0 12px 0; background: var(--pembe-acik); opacity: .5; animation: dus linear infinite; }
  @keyframes dus { to { transform: translate(var(--kay, 80px), 110vh) rotate(540deg); } }

  /* ---------- tanima sahnesi */
  .tanima { position: fixed; inset: 0; z-index: 10; background: #07050a; display: grid; place-items: center; padding: 24px; }
  .terminal { width: 100%; max-width: 560px; font-family: VT323, monospace; font-size: 22px; color: var(--miku); }
  .terminal .satir { white-space: pre-wrap; min-height: 1.2em; }
  .terminal .satir.pembe { color: var(--pembe); }
  .imlec { display: inline-block; width: .55em; background: var(--miku); animation: yanip .8s steps(1) infinite; }
  @keyframes yanip { 50% { opacity: 0; } }
  .hosgeldin { text-align: center; }
  .hosgeldin .kucuk { color: var(--miku); font-size: 22px; letter-spacing: .3em; }
  .hosgeldin h1 { margin: 6px 0 2px; font-size: min(12vw, 76px); font-weight: 400; line-height: 1; color: var(--pembe); text-shadow: 0 0 24px #ff5fa888, 0 0 2px #fff; animation: belir .9s cubic-bezier(.2, 1.4, .4, 1) both; }
  .hosgeldin .lakap { color: var(--pembe-acik); font-size: 20px; animation: belir 1s .3s both; }
  @keyframes belir { from { transform: scale(.6) translateY(20px); opacity: 0; } }
  .kimlik { margin-top: 22px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; animation: belir 1s .6s both; font-family: "M PLUS Rounded 1c", sans-serif; font-size: 15px; }

  /* ---------- dugmeler */
  .dugme {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
    padding: 12px 20px; border: 0; border-radius: 999px; font-weight: 800; font-size: 15px;
    background: var(--pembe); color: #2a0718; box-shadow: 0 6px 24px #ff5fa855;
    transition: transform .15s cubic-bezier(.3, 1.6, .5, 1), filter .15s;
  }
  .dugme:hover { transform: translateY(-2px) scale(1.03); filter: brightness(1.08); }
  .dugme:active { transform: scale(.95); }
  .dugme.ikincil { background: var(--yuzey2); color: var(--metin); border: 1px solid var(--kenar); box-shadow: none; }
  .dugme.miku { background: var(--miku); color: #052522; box-shadow: 0 6px 24px #39c5bb44; }
  input[type=text] { padding: 12px 16px; background: var(--zemin); border: 1px solid var(--kenar); border-radius: 999px; outline: none; }
  input[type=text]:focus { border-color: var(--pembe); box-shadow: 0 0 0 3px #ff5fa833; }

  /* ---------- oda */
  .oda { position: relative; z-index: 1; height: 100%; display: grid; grid-template-columns: 1fr 340px; }
  .sahne-kap { display: flex; flex-direction: column; min-height: 0; padding: 14px; gap: 10px; }
  .bas { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .logo { font-weight: 800; font-size: 20px; color: var(--pembe); margin-right: 4px; }
  .logo .kulak { color: var(--miku); }
  .rozet { font-size: 12px; font-weight: 700; padding: 4px 11px; border-radius: 999px; background: var(--yuzey2); border: 1px solid var(--kenar); color: var(--ikincil); white-space: nowrap; }
  .rozet.aktif { color: var(--miku); border-color: #39c5bb55; }
  .rozet.aktif::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--miku); margin-right: 6px; box-shadow: 0 0 8px var(--miku); animation: nabiz 1.6s infinite; }
  .rozet.canli { color: #ff6b7a; border-color: #ff6b7a66; }
  .rozet.film { color: var(--pembe-acik); border-color: #ff5fa855; }
  @keyframes nabiz { 50% { opacity: .35; } }
  .bosluk { flex: 1; }
  .bas .dugme { padding: 8px 14px; font-size: 13px; }

  .sahne { position: relative; flex: 1; min-height: 0; border-radius: 18px; overflow: hidden; background: #000; border: 1px solid var(--kenar); box-shadow: 0 0 0 1px #ff5fa81a, 0 20px 60px #0008; }
  .sahne.sarsil { animation: sarsil .5s; }
  @keyframes sarsil {
    10%, 90% { transform: translate(-2px, 1px); } 20%, 80% { transform: translate(4px, -2px); }
    30%, 50%, 70% { transform: translate(-6px, 3px); } 40%, 60% { transform: translate(6px, -3px); }
  }
  .sahne.phonk { animation: phonk .4615s ease-out 6; }
  @keyframes phonk { 0% { transform: scale(1.025); filter: hue-rotate(40deg) saturate(1.6); } 100% { transform: scale(1); filter: none; } }
  video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
  .bekle { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; background: radial-gradient(circle at 50% 40%, #2a1430, #0a070c 70%); overflow: auto; }
  .bekle h2 { margin: 8px 0 6px; font-size: 26px; color: var(--pembe); }
  .bekle p { margin: 0 auto; max-width: 440px; color: var(--ikincil); }
  .bekle .not { margin-top: 14px; font-size: 13px; color: var(--soluk); }
  .bekle .mektup { margin: 18px auto 0; max-width: 430px; padding: 12px 16px; border-radius: 14px; text-align: left; background: #ff5fa814; border: 1px dashed #ff5fa866; color: var(--pembe-acik); font-size: 14px; }
  .kedi-buyuk { font-size: 56px; display: inline-block; animation: zipla 1.4s ease-in-out infinite; }
  @keyframes zipla { 50% { transform: translateY(-10px) rotate(-6deg); } }
  .davet { display: flex; gap: 8px; margin-top: 12px; justify-content: center; flex-wrap: wrap; }
  .davet input { width: min(100%, 360px); font-size: 12px; }
  .ses-ac { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 4; }

  /* tepkiler */
  .tepkiler { display: flex; gap: 8px; flex-wrap: wrap; }
  .tepki { border: 1px solid var(--kenar); background: var(--yuzey); border-radius: 999px; padding: 7px 13px; cursor: pointer; font-weight: 800; font-size: 13px; transition: transform .15s cubic-bezier(.3, 1.8, .5, 1); }
  .tepki:hover { transform: translateY(-3px) rotate(-3deg); border-color: var(--pembe); }
  .tepki:active { transform: scale(.9); }
  .tepki.cigilik { color: #ff6b7a; }
  .tepki.phonk { color: #c58bff; border-color: #7b4bb055; }
  .tepki.mikub { color: var(--miku); }
  .tepki.atla { color: #ffd23f; border-color: #ffd23f55; }

  .ucan { position: absolute; bottom: 10%; z-index: 5; pointer-events: none; font-weight: 800; white-space: nowrap; animation: uc 2.6s ease-out forwards; text-shadow: 0 2px 10px #000a; }
  @keyframes uc { 0% { transform: translateY(0) scale(.6); opacity: 0; } 12% { opacity: 1; transform: translateY(-20px) scale(1.15); } 100% { transform: translateY(-260px) scale(1); opacity: 0; } }
  .koca { position: absolute; inset: 0; z-index: 6; display: grid; place-items: center; text-align: center; pointer-events: none; font-weight: 800; white-space: pre-line; line-height: 1.1; animation: koca 1s ease-out forwards; }
  .koca.ciglik { font-size: min(18vw, 160px); color: #ff3b5c; text-shadow: 0 0 40px #ff3b5c; }
  .koca.phonkyazi { white-space: pre-line; line-height: 1; font-size: min(11vw, 96px); color: #c58bff; text-shadow: 0 0 30px #8a3cff; animation-duration: 2.8s; }
  .koca.uyari { font-size: min(7vw, 52px); color: #ffd23f; text-shadow: 0 0 24px #ff3b5c; animation-duration: 2.2s; }
  @keyframes koca { 0% { transform: scale(.4); opacity: 0; } 15% { transform: scale(1.1); opacity: 1; } 80% { opacity: 1; } 100% { transform: scale(1.3); opacity: 0; } }
  .yuruyen-kedi { position: absolute; bottom: 6px; left: -60px; z-index: 5; font-size: 34px; pointer-events: none; animation: yuru 9s linear forwards; }
  .yuruyen-kedi span { position: absolute; top: -18px; left: 30px; font-size: 12px; font-weight: 800; color: var(--pembe-acik); white-space: nowrap; }
  @keyframes yuru { to { left: calc(100% + 60px); } }
  .kosan { position: absolute; bottom: 14%; left: -80px; z-index: 5; font-size: 40px; pointer-events: none; animation: kos 1.4s linear forwards; }
  @keyframes kos { to { left: calc(100% + 80px); } }

  /* sohbet */
  .sohbet { position: relative; z-index: 1; display: flex; flex-direction: column; background: #140e18e6; border-left: 1px solid var(--kenar); min-height: 0; }
  .sohbet-bas { padding: 12px 16px; border-bottom: 1px solid var(--kenar); }
  .sohbet-bas .ust { display: flex; align-items: center; gap: 8px; }
  .sohbet-bas b { color: var(--pembe); }
  .kisiler, .skor { font-size: 12px; color: var(--soluk); }
  .skor { color: #ffd23f; margin-top: 2px; min-height: 1em; }
  .mesajlar { flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 9px; min-height: 0; }
  .mesaj { animation: mesajGel .35s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes mesajGel { from { transform: translateY(8px) scale(.96); opacity: 0; } }
  .mesaj .kim { font-weight: 800; font-size: 13px; color: var(--miku); margin-right: 6px; }
  .mesaj.ben .kim { color: var(--pembe); }
  .mesaj .ne { overflow-wrap: anywhere; }
  .sistem { font-size: 12px; color: var(--soluk); text-align: center; animation: mesajGel .35s; }
  .sistem.kedi { color: var(--pembe-acik); }
  .sistem.alarm { color: #ffd23f; font-weight: 800; }
  .yaz { position: relative; display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--kenar); }
  .yaz input { flex: 1; min-width: 0; }
  .yaz .dugme { padding: 10px 16px; }
  .emoji-ac { width: 42px; padding: 0 !important; font-size: 18px; }
  .emojiler { position: absolute; bottom: 64px; left: 12px; right: 12px; display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; padding: 10px; background: var(--yuzey2); border: 1px solid var(--kenar); border-radius: 14px; box-shadow: 0 10px 30px #000a; z-index: 3; }
  .emojiler button { border: 0; background: none; font-size: 21px; padding: 4px; border-radius: 8px; cursor: pointer; transition: transform .12s; }
  .emojiler button:hover { background: var(--yuzey); transform: scale(1.2); }

  /* Telefon ve dik tablet: ustte film, altinda tek satir tepki, kalan alanda sohbet. */
  @media (max-width: 820px) {
    .oda { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: 100dvh; }
    .sahne-kap { padding: max(8px, env(safe-area-inset-top)) 8px 6px; gap: 8px; min-width: 0; }
    .bas { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    .bas::-webkit-scrollbar, .tepkiler::-webkit-scrollbar { display: none; }
    .bas > * { flex: none; }
    .bas .bosluk { display: none; }
    .logo { font-size: 17px; white-space: nowrap; }
    .sahne { flex: none; aspect-ratio: 16 / 9; border-radius: 12px; }
    .tepkiler { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    .tepki { flex: none; padding: 9px 14px; }
    .sohbet { border-left: 0; border-top: 1px solid var(--kenar); min-height: 0; }
    .yaz { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
    input[type=text] { font-size: 16px; }   /* iPhone yaziya basinca sayfayi buyutmesin */
    .bekle h2 { font-size: 20px; }
    .bekle .mektup { font-size: 13px; }
    .kedi-buyuk { font-size: 40px; }
  }

  /* Tiyatro: telefon yan cevrilince ya da Fullscreen'e basilinca. Film butun
     ekrani kaplar; tepkiler altta yari saydam serit, sohbet sagdan acilir. */
  .yuzen { position: fixed; top: max(10px, env(safe-area-inset-top)); right: max(10px, env(safe-area-inset-right)); z-index: 9; display: none; gap: 8px; }
  .yuzen button { position: relative; width: 44px; height: 44px; border-radius: 50%; border: 1px solid #ffffff33; background: #0009; color: #fff; font-size: 19px; cursor: pointer; }
  .yuzen .rakam { position: absolute; top: -4px; right: -4px; min-width: 19px; height: 19px; padding: 0 5px; border-radius: 10px; background: var(--pembe); color: #2a0718; font-size: 11px; font-weight: 800; line-height: 19px; }
  .tost { position: absolute; left: max(12px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top)); z-index: 7; max-width: 60%; padding: 8px 12px; border-radius: 12px; background: #000b; font-size: 14px; pointer-events: none; animation: tost 4.5s ease forwards; }
  .tost b { color: var(--pembe); margin-right: 6px; }
  @keyframes tost { 0% { transform: translateY(-8px); opacity: 0; } 8%, 85% { transform: none; opacity: 1; } 100% { opacity: 0; } }
  .oda.tiyatro { grid-template-columns: minmax(0, 1fr); height: 100dvh; }
  .oda.tiyatro .sahne-kap { padding: 0; }
  .oda.tiyatro .bas { display: none; }
  .oda.tiyatro .sahne { position: fixed; inset: 0; border-radius: 0; border: 0; aspect-ratio: auto; z-index: 2; }
  .oda.tiyatro .yuzen { display: flex; }
  .oda.tiyatro .tepkiler {
    position: fixed; z-index: 7; left: 0; right: 0; bottom: 0; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none;
    padding: 10px max(12px, env(safe-area-inset-left)) max(10px, env(safe-area-inset-bottom)); background: linear-gradient(#0000, #000a);
  }
  .oda.tiyatro .tepki { flex: none; background: #0008; border-color: #ffffff2a; padding: 7px 12px; }
  .oda.tiyatro .sohbet {
    position: fixed; z-index: 8; top: 0; right: 0; bottom: 0; width: min(42vw, 360px); border-left: 1px solid var(--kenar);
    transform: translateX(105%); transition: transform .35s cubic-bezier(.2, 1, .3, 1); padding-right: env(safe-area-inset-right);
  }
  .oda.tiyatro.sohbet-acik .sohbet { transform: none; }
  @media (max-width: 600px) { .oda.tiyatro .sohbet { width: 100vw; } }

  /* ---------- parents mode (yalnizca host): simsiyah, sadece paylasilan ekran */
  body.ebeveyn { background: #000; }
  body.ebeveyn .arka, body.ebeveyn .sohbet, body.ebeveyn .bas, body.ebeveyn .tepkiler,
  body.ebeveyn .ucan, body.ebeveyn .koca, body.ebeveyn .yuzen, body.ebeveyn .tost, body.ebeveyn .yuruyen-kedi, body.ebeveyn .kosan, body.ebeveyn .bekle { display: none !important; }
  body.ebeveyn .oda { grid-template-columns: 1fr; }
  body.ebeveyn .sahne-kap { padding: 0; }
  body.ebeveyn .sahne { border: 0; border-radius: 0; box-shadow: none; animation: none !important; }

  @media (prefers-reduced-motion: reduce) { .yaprak, .kedi-buyuk, .serit { animation: none; } .yaprak { display: none; } }
</style>
</head>
<body>

<div class="arka" id="arka">
  <div class="serit-kap" id="seritler"></div>
  <div class="kanji sol">叫んで逃げろ</div>
  <div class="kanji sag">一緒に見よう・猫</div>
</div>

<section class="tanima" id="tanima"><div class="terminal" id="terminal"></div></section>

<section class="oda gizli" id="oda">
  <div class="sahne-kap">
    <div class="bas">
      <span class="logo" id="logo"></span>
      <span class="rozet" id="durum">connecting…</span>
      <span class="rozet film" id="film"></span>
      <span class="rozet" id="saatler"></span>
      <span class="bosluk"></span>
      <button class="dugme gizli" id="yayinla">Start the movie</button>
      <button class="dugme ikincil gizli" id="durdur">Stop</button>
      <button class="dugme ikincil gizli" id="kalite" title="Freezing? Lower it">Quality: HD 60fps</button>
      <button class="dugme ikincil gizli" id="ebeveyn" title="Shortcut: P">Parents mode</button>
      <button class="dugme ikincil" id="tamekran">Fullscreen</button>
    </div>
    <div class="sahne" id="sahne">
      <video id="video" playsinline autoplay></video>
      <div class="bekle" id="bekle"><div id="bekle-icerik"></div></div>
      <button class="dugme ses-ac gizli" id="ses-ac">Tap for sound</button>
      <div class="yuzen">
        <button id="sohbet-ac" aria-label="Chat">💬<span class="rakam gizli" id="okunmamis"></span></button>
        <button id="tiyatro-cik" aria-label="Exit fullscreen">✕</button>
      </div>
    </div>
    <div class="tepkiler" id="tepkiler">
      <button class="tepki cigilik" data-t="scream">AAAAA</button>
      <button class="tepki" data-t="run">RUN</button>
      <button class="tepki phonk" data-t="phonk">MR PHONK</button>
      <button class="tepki" data-t="catboy">CAT BOY</button>
      <button class="tepki mikub" data-t="miku">MIKU</button>
      <button class="tepki" data-t="nya">nyaa~</button>
      <button class="tepki" data-t="eyes">👀</button>
      <button class="tepki" data-t="skull">💀</button>
      <button class="tepki atla" data-t="skip">SKIP 😳</button>
    </div>
  </div>
  <aside class="sohbet">
    <div class="sohbet-bas">
      <div class="ust"><b>chat</b><span class="bosluk"></span><span class="kisiler" id="kisiler"></span></div>
      <div class="skor" id="skor"></div>
    </div>
    <div class="mesajlar" id="mesajlar"></div>
    <form class="yaz" id="yaz">
      <div class="emojiler gizli" id="emojiler"></div>
      <button class="dugme ikincil emoji-ac" type="button" id="emoji-ac" aria-label="Emoji">😼</button>
      <input type="text" id="metin" maxlength="500" placeholder="say something (or scream)" autocomplete="off">
      <button class="dugme" type="submit">Send</button>
    </form>
  </aside>
</section>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
// Screening Room — tek ve sabit bir oda. Odayi acan (host) ?host ile girer,
// filmin sekmesini sesiyle yayinlar; en fazla 4 kisi daha izler. Goruntu
// WebRTC ile dogrudan hosttan izleyicilere gider; PeerJS'in ucretsiz araci
// sunucusu yalnizca tarayicilari tanistirir.
//
// KISISEL ICERIK SIFRELI: isimler, lakaplar, notlar ve espriler PAKET'te
// AES-GCM ile duruyor; anahtar yalnizca davet linkinin #k= kisminda (o kisim
// sunucuya hic gitmez). Anahtarsiz gelen biri odayi da bulamaz: oda kimligi
// anahtardan turetiliyor. Uretim: node kur.mjs
'use strict';

const PAKET = '__PAKET__';
const $ = (id) => document.getElementById(id);
const EN_FAZLA_IZLEYICI = 4;                 // host ile birlikte 5 kisi
const HOST_MU = new URLSearchParams(location.search).has('host');
const AYAR = {
  config: {
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' },
      { urls: 'stun:stun.cloudflare.com:3478' },
    ],
  },
};

let P = null;                    // cozulmus kisisel paket
let peer = null;
let ad = '';
let akis = null;                 // host: yayinlanan sekme
const izleyiciler = new Map();   // host: peerId -> { conn, call, ad }
let hostBaglanti = null;         // izleyici: hosta veri baglantisi
let ebeveyn = false;             // host: parents mode
let kediKulak = 0;               // cat boy: hostun adinda kulak bitis zamani
const skor = {};                 // ad -> cigilik sayisi (host tutar, herkese yollar)

// ------------------------------------------------------------ yardimcilar
const bekle = (ms) => new Promise((r) => setTimeout(r, ms));
const rastgele = (dizi) => dizi[Math.floor(Math.random() * dizi.length)];

async function paketiCoz() {
  const k = new URLSearchParams(location.hash.slice(1)).get('k');
  if (!k) return null;
  try {
    const b64 = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));
    const anahtar = await crypto.subtle.importKey('raw', b64(k), 'AES-GCM', false, ['decrypt']);
    const veri = b64(PAKET);
    const acik = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: veri.slice(0, 12) }, anahtar, veri.slice(12));
    const p = JSON.parse(new TextDecoder().decode(acik));
    const ozet = new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode('oda:' + k)));
    p.oda = 'scr-' + Array.from(ozet.slice(0, 10), (b) => b.toString(16).padStart(2, '0')).join('');
    return p;
  } catch (_) {
    return null;
  }
}

// ------------------------------------------------------------ host
/// Host: araci sunucu (PeerJS) baglantisi koparsa izleyicilerle olan dogrudan
/// baglantilar surer; yalnizca yeni gelenler bulamaz. Bu yuzden artan
/// beklemeyle yeniden baglanilir ve baglaninca durum geri doner. Sayfa
/// yenilenince sunucu eski oturumu ~1 dk acik sayar: o surede ad "alinmis"
/// doner, beklenip tekrar denenir ("already open" denmez).
let hostAcildi = false;
let yenidenDeneme = 0;
function hostBasla() {
  durum('opening the room…');
  $('ebeveyn').classList.remove('gizli');
  $('kalite').classList.remove('gizli');
  peer = new Peer(P.oda, AYAR);
  peer.on('open', () => {
    yenidenDeneme = 0;
    if (hostAcildi) {   // yeniden baglanti: yalnizca durumu duzelt, ekrana dokunma
      akis ? durum('LIVE', 'canli') : durum('room active', 'aktif');
      return;
    }
    hostAcildi = true;
    const link = `${location.origin}${location.pathname}${location.hash}`;
    durum('room active', 'aktif');
    $('yayinla').classList.remove('gizli');
    kisileriGuncelle();
    bekleGoster(`
      <div class="kedi-buyuk">🐈‍⬛</div>
      <h2>Your room is live, ${P.host}</h2>
      <p>Send this link to ${P.lakap}:</p>
      <div class="davet"><input type="text" id="link" readonly><button class="dugme" id="kopyala">Copy</button></div>
      <p class="not">Open the movie in another Chrome tab, come back, hit <b>Start the movie</b> and pick that tab.<br>Keep <b>"Also share tab audio"</b> on. Press <b>P</b> any time for parents mode.</p>`);
    $('link').value = link;
    $('kopyala').onclick = async () => {
      try { await navigator.clipboard.writeText(link); $('kopyala').textContent = 'Copied!'; }
      catch (_) { $('link').select(); }
    };
    mesajEkle({ tur: 'sistem', metin: 'room is open. waiting for the victims… I mean, guests.' });
  });
  peer.on('connection', (conn) => {
    conn.on('open', () => {
      if (izleyiciler.size >= EN_FAZLA_IZLEYICI) {
        conn.send({ tur: 'dolu' });
        setTimeout(() => conn.close(), 500);
        return;
      }
      izleyiciler.set(conn.peer, { conn, call: null, ad: '' });
      conn.send({ tur: 'skor', s: skor });
      kisileriGuncelle();
      if (akis) cagir(conn.peer);
    });
    conn.on('data', (veri) => hostVeri(conn.peer, veri));
    conn.on('close', () => ayrildi(conn.peer));
    conn.on('error', () => ayrildi(conn.peer));
  });
  peer.on('disconnected', yenidenBaglan);
  peer.on('error', (e) => {
    if (e.type === 'unavailable-id') {
      // Cogu zaman ayni odanin az onceki oturumu (sayfa yenilendi): bekle, tekrar dene.
      durum('waiting for the old session…');
      if (!hostAcildi) bekleGoster('<div class="kedi-buyuk">⏳</div><h2>Opening the room…</h2><p>The room was open a moment ago (maybe you refreshed). Trying again every few seconds.<br>If it is open in another tab, close that one.</p>');
      setTimeout(() => {
        if (peer.destroyed) return;
        if (hostAcildi) peer.reconnect();
        else { peer.destroy(); hostBasla(); }
      }, 5000);
      return;
    }
    if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(e.type)) { yenidenBaglan(); return; }
    if (e.type === 'peer-unavailable') return;
    durum('connection error');
    mesajEkle({ tur: 'sistem', metin: 'connection error: ' + (e.type || e.message) });
  });
}

function yenidenBaglan() {
  if (!peer || peer.destroyed || !peer.disconnected) return;
  durum('reconnecting…');
  const bekleme = Math.min(1000 * 2 ** yenidenDeneme++, 15000);
  setTimeout(() => { if (!peer.destroyed && peer.disconnected) peer.reconnect(); }, bekleme);
}

function hostVeri(id, veri) {
  const kisi = izleyiciler.get(id);
  if (!kisi || !veri || typeof veri !== 'object') return;
  if (veri.tur === 'merhaba') {
    kisi.ad = String(veri.ad || 'someone').slice(0, 20);
    herkese({ tur: 'sistem', metin: rastgele(KATILDI)(kisi.ad) });
  } else if (veri.tur === 'mesaj') {
    const metin = String(veri.metin || '').slice(0, 500);
    if (metin) herkese({ tur: 'mesaj', ad: kisi.ad || 'someone', metin }, id);
  } else if (veri.tur === 'tepki') {
    tepkiDagit(String(veri.t), kisi.ad || 'someone', id);
  }
}

/// Host: tepkiyi herkese yollar (basan izleyici kendisinde zaten oynatti);
/// cigilikta skoru tutar.
function tepkiDagit(t, kim, haric) {
  herkese({ tur: 'tepki', t, ad: kim }, haric);
  if (t === 'scream') { skor[kim] = (skor[kim] || 0) + 1; herkese({ tur: 'skor', s: skor }); }
}

/// Mesaji hostta gosterir ve gonderen disindaki herkese iletir.
function herkese(m, haric) {
  goster(m);
  for (const [id, k] of izleyiciler) if (id !== haric && k.conn.open) k.conn.send(m);
}
function goster(m) {
  if (m.tur === 'tepki') tepkiOyna(m.t, m.ad);
  else if (m.tur === 'skor') skorGoster(m.s);
  else mesajEkle(m);
}
function ayrildi(id) {
  const k = izleyiciler.get(id);
  if (!k) return;
  izleyiciler.delete(id);
  try { k.call && k.call.close(); } catch (_) {}
  kisileriGuncelle();
  if (k.ad) herkese({ tur: 'sistem', metin: rastgele(AYRILDI)(k.ad) });
}

async function yayinBaslat() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
    mesajEkle({ tur: 'sistem', metin: 'this browser cannot share its screen. use Chrome or Edge on a computer.' });
    return;
  }
  try {
    akis = await navigator.mediaDevices.getDisplayMedia({
      // 720p: Turkiye-ABD gibi uzak baglantida 1080p surekli takiliyordu.
      video: { frameRate: { ideal: 60, max: 60 }, width: { ideal: 1280, max: 1280 }, height: { ideal: 720, max: 720 } },
      // Film sesi: yanki ve gurultu suzgecleri muzigi bozar, kapali.
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false },
      preferCurrentTab: false, selfBrowserSurface: 'exclude', surfaceSwitching: 'include', systemAudio: 'include',
    });
  } catch (_) {
    return;
  }
  const v = akis.getVideoTracks()[0];
  if (v) { v.contentHint = 'motion'; v.onended = yayinDurdur; }
  if (!akis.getAudioTracks().length) {
    mesajEkle({ tur: 'sistem', metin: 'heads up: no sound is being shared. stop, start again, pick the "Tab" and keep "Also share tab audio" on.' });
  }
  $('video').srcObject = akis;
  $('video').muted = true;   // host filmi kendi sekmesinden duyuyor
  bekleGizle();
  $('yayinla').classList.add('gizli');
  $('durdur').classList.remove('gizli');
  durum('LIVE', 'canli');
  for (const id of izleyiciler.keys()) cagir(id);
  herkese({ tur: 'sistem', metin: '🎃 the movie is starting. no screaming. (scream.)' });
}

function yayinDurdur() {
  if (!akis) return;
  akis.getTracks().forEach((t) => t.stop());
  akis = null;
  for (const k of izleyiciler.values()) { try { k.call && k.call.close(); } catch (_) {} k.call = null; }
  $('video').srcObject = null;
  $('durdur').classList.add('gizli');
  $('yayinla').classList.remove('gizli');
  durum('room active', 'aktif');
  bekleGoster('<div class="kedi-buyuk">🐈</div><h2>Intermission</h2><p>Hit <b>Start the movie</b> to go again.</p>');
  herkese({ tur: 'sistem', metin: 'intermission. go pet a cat.' });
}

/// Gorusme tanimini duzenler: once H.264 (Mac de iPhone da donanimla
/// sikistirip aciyor; VP8 iki tarafta da islemciyi bogup kare atlatiyordu),
/// film sesi icin stereo ve 128 kbit Opus.
function sdpDuzenle(sdp) {
  const satir = sdp.split('\r\n');
  const mi = satir.findIndex((l) => l.startsWith('m=video'));
  if (mi >= 0) {
    const h264 = satir.map((l) => l.match(/^a=rtpmap:(\d+) H264\/90000/i)).filter(Boolean).map((m) => m[1]);
    const parca = satir[mi].split(' '), pt = parca.slice(3);
    if (h264.length) satir[mi] = [...parca.slice(0, 3), ...pt.filter((x) => h264.includes(x)), ...pt.filter((x) => !h264.includes(x))].join(' ');
  }
  const opus = satir.map((l) => l.match(/^a=rtpmap:(\d+) opus\/48000/i)).find(Boolean);
  if (opus) {
    const fi = satir.findIndex((l) => l.startsWith(`a=fmtp:${opus[1]} `));
    if (fi >= 0 && !/stereo=1/.test(satir[fi])) satir[fi] += ';stereo=1;sprop-stereo=1;maxaveragebitrate=128000';
  }
  return satir.join('\r\n');
}

// Kalite: donma olursa host film durmadan dusurur (cozunurluk ve bit hizi).
// HD 60 kare (urun sahibi istedi); donarsa 30 kareye ve daha dusuk cozunurluge iner.
const KALITE = [
  { ad: 'HD 60fps', olcek: 1, bit: 5000000, kare: 60 },
  { ad: 'Smooth 30fps', olcek: 1, bit: 2500000, kare: 30 },
  { ad: 'Max smooth', olcek: 1.5, bit: 1200000, kare: 30 },
];
let kalite = 0;
function kaliteUygula(pc) {
  for (const s of pc.getSenders()) {
    if (!s.track || s.track.kind !== 'video') continue;
    const p = s.getParameters();
    if (!p.encodings || !p.encodings.length) p.encodings = [{}];
    p.encodings[0].maxBitrate = KALITE[kalite].bit;
    p.encodings[0].maxFramerate = KALITE[kalite].kare;
    p.encodings[0].scaleResolutionDownBy = KALITE[kalite].olcek;
    p.degradationPreference = 'balanced';
    s.setParameters(p).catch(() => {});
  }
}
$('kalite').onclick = () => {
  kalite = (kalite + 1) % KALITE.length;
  $('kalite').textContent = `Quality: ${KALITE[kalite].ad}`;
  for (const k of izleyiciler.values()) if (k.call && k.call.peerConnection) kaliteUygula(k.call.peerConnection);
};

function cagir(id) {
  const k = izleyiciler.get(id);
  if (!k || !akis) return;
  try { k.call && k.call.close(); } catch (_) {}
  const call = peer.call(id, akis, { sdpTransform: sdpDuzenle });
  k.call = call;
  const pc = call.peerConnection;
  if (pc) pc.addEventListener('connectionstatechange', () => { if (pc.connectionState === 'connected') kaliteUygula(pc); });
}

});

  <div class="kedi-buyuk">🐈‍⬛</div>
  <h2>Grab a blanket, ${ad === P.lakap ? P.lakap : ad.replace(/[<&]/g, '')}</h2>

  <p class="not">tip: hit <b>AAAAA</b> when something jumps. everyone's screen shakes.</p>`;

function izleyiciBasla() {
  durum('looking for the room…');
  bekleGoster('<div class="kedi-buyuk">🐈</div><h2>Knocking on the door…</h2>');
  peer = new Peer(AYAR);
  peer.on('open', baglan);
  peer.on('call', (call) => {
    call.answer(undefined, { sdpTransform: sdpDuzenle });
    call.on('stream', (s) => {
      // Uzak baglantidaki kucuk gecikmeler donma olarak gorunmesin: yarim saniyelik tampon.
      for (const r of call.peerConnection.getReceivers()) {
        try {
          if ('jitterBufferTarget' in r) r.jitterBufferTarget = 500;
          else if ('playoutDelayHint' in r) r.playoutDelayHint = .5;
        } catch (_) {}
      }
      const v = $('video');
      v.srcObject = s;
      v.muted = false;
      bekleGizle();
      durum('LIVE', 'canli');
      ekranUyanik(true);
      // Tarayici sesli oynatmaya izin vermezse sessiz baslat, "sesi ac" goster.
      v.play().catch(() => { v.muted = true; v.play().catch(() => {}); $('ses-ac').classList.remove('gizli'); });
    });
    call.on('close', () => { durum('room active', 'aktif'); bekleGoster(BEKLEME()); ekranUyanik(false); });
  });
  peer.on('error', (e) => {
    if (e.type === 'peer-unavailable') {
      durum('room is asleep');
      bekleGoster(`<div class="kedi-buyuk">😴</div><h2>The room is asleep</h2><p>${P.host} hasn't opened it yet. This page keeps knocking every few seconds.</p>`);
      setTimeout(baglan, 5000);
      return;
    }
    durum('connection error');
    mesajEkle({ tur: 'sistem', metin: 'connection error: ' + (e.type || e.message) });
  });
}

function baglan() {
  if (!peer || peer.destroyed) return;
  hostBaglanti = peer.connect(P.oda, { reliable: true });
  hostBaglanti.on('open', () => {
    hostBaglanti.send({ tur: 'merhaba', ad });
    durum('room active', 'aktif');
    bekleGoster(BEKLEME());
  });
  hostBaglanti.on('data', (m) => { if (m && typeof m === 'object') izleyiciVeri(m); });
  hostBaglanti.on('close', () => {
    durum('room closed');
    $('video').srcObject = null;
    bekleGoster(`<div class="kedi-buyuk">🏃‍♀️</div><h2>${P.host} screamed and ran</h2><p>The room closed. Refresh when it's back.</p>`);
  });
}

function izleyiciVeri(m) {
  if (m.tur === 'dolu') {
    hostBaglanti.removeAllListeners('close');
    durum('room is full');
    bekleGoster('<div class="kedi-buyuk">🙀</div><h2>The room is full</h2><p>Only 5 people fit on this couch.</p>');
    return;
  }
  if (m.tur === 'tepki') { tepkiOyna(String(m.t), String(m.ad || '')); return; }
  if (m.tur === 'skor') { if (m.s && typeof m.s === 'object') skorGoster(m.s); return; }
  if (m.tur === 'sistem' || m.tur === 'mesaj') mesajEkle({ tur: m.tur, ad: String(m.ad || ''), metin: String(m.metin || ''), kedi: m.kedi, alarm: m.alarm });
}

$('ses-ac').onclick = () => { const v = $('video'); v.muted = false; v.play(); $('ses-ac').classList.add('gizli'); };

// ------------------------------------------------------------ tepkiler
const TEPKI = {
  scream: { yazi: 'AAAAAAA', renk: '#ff3b5c' },
  run: { yazi: 'RUN 🏃‍♀️💨', renk: '#ffc1dc' },
  phonk: { yazi: 'MR PHONK 🎵', renk: '#c58bff' },
  catboy: { yazi: 'GOOOO CAT BOY 🐱', renk: '#ff5fa8' },
  miku: { yazi: 'MIKUUSUSUDIEIWIWIEIDIRJAJJ', renk: '#39c5bb' },
  nya: { yazi: 'nyaa~ 🐱', renk: '#ff5fa8' },
  eyes: { yazi: '👀', renk: '#39c5bb' },
  skull: { yazi: '💀', renk: '#fbeef5' },
  skip: { yazi: 'SKIP 😳', renk: '#ffd23f' },
};
function ucur(yazi, renk, boy) {
  const u = document.createElement('div');
  u.className = 'ucan';
  u.style.left = 8 + Math.random() * 60 + '%';
  u.style.color = renk;
  u.style.fontSize = boy + 'px';
  u.textContent = yazi;
  $('sahne').append(u);
  setTimeout(() => u.remove(), 2700);
}
function efekt(sinif, yazi, sure) {
  const c = document.createElement('div'); c.className = sinif; c.textContent = yazi;
  $('sahne').append(c); setTimeout(() => c.remove(), sure);
}
function tepkiOyna(t, kim) {
  const tk = TEPKI[t];
  if (!tk) return;
  const sahne = $('sahne');
  if (t === 'scream') {
    sahne.classList.remove('sarsil'); void sahne.offsetWidth; sahne.classList.add('sarsil');
    efekt('koca ciglik', 'AAAAA', 1000);
  } else if (t === 'run') {
    const k = document.createElement('div'); k.className = 'kosan'; k.textContent = '🏃‍♀️💨';
    sahne.append(k); setTimeout(() => k.remove(), 1500);
  } else if (t === 'phonk') {
    sahne.classList.remove('phonk'); void sahne.offsetWidth; sahne.classList.add('phonk');
    efekt('koca phonkyazi', 'MR PHONK\n4EVER', 2800);
    if (!ebeveyn) phonkCal();
  } else if (t === 'catboy') {
    kediKulak = Date.now() + 60000;
  } else if (t === 'skip') {
    // Tuhaf sahne: herkes gorur; film hostun sekmesinde oldugu icin ileri
    // sarmayi o yapar, ona ayrica sohbette uyari duser.
    efekt('koca uyari', '😳 AWKWARD SCENE DETECTED\nskipping… 💀', 2600);
    if (HOST_MU) mesajEkle({ tur: 'sistem', alarm: true, metin: `⏩ ${kim || 'someone'} wants to skip. fast-forward the movie!` });
  }
  const iri = t === 'skull' || t === 'eyes';
  ucur(kim ? `${tk.yazi}  ·  ${kim}` : tk.yazi, tk.renk, iri ? 38 : 20);
}
let sonTepki = 0;
$('tepkiler').addEventListener('click', (e) => {
  const b = e.target.closest('.tepki');
  if (!b) return;
  sesHazirla();
  const simdi = Date.now();
  if (simdi - sonTepki < 700) return;   // tepki seli olmasin
  sonTepki = simdi;
  if (HOST_MU) tepkiDagit(b.dataset.t, ad);
  else if (hostBaglanti && hostBaglanti.open) { hostBaglanti.send({ tur: 'tepki', t: b.dataset.t }); tepkiOyna(b.dataset.t, ad); }
  else { tepkiOyna(b.dataset.t, ad); bagliDegil(); }   // tek basina denerken de gorunsun
});

/// Izleyici odaya baglanmadan tus ya da mesaj: sessizce kaybolmasin.
let sonUyari = 0;
function bagliDegil() {
  if (Date.now() - sonUyari < 4000) return;
  sonUyari = Date.now();
  mesajEkle({ tur: 'sistem', alarm: true, metin: `not connected to the room yet. wait for "room active" at the top (${P.host} has to open the room).` });
}

// ------------------------------------------------------------ MR PHONK: kisa phonk ritmi (WebAudio, dosya yok)
let ses = null;
function sesHazirla() {
  if (!ses) { try { ses = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} }
  if (ses && ses.state === 'suspended') ses.resume();
}
function phonkCal() {
  if (!ses) return;
  const t0 = ses.currentTime + 0.05, adim = 60 / 130 / 2;      // 130 bpm, sekizlik
  const ana = ses.createGain(); ana.gain.value = 0.22; ana.connect(ses.destination);
  const kick = (t) => {
    const o = ses.createOscillator(), g = ses.createGain();
    o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.35);
    g.gain.setValueAtTime(1, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
    o.connect(g).connect(ana); o.start(t); o.stop(t + 0.5);
  };
  const cowbell = (t, kat) => {
    const g = ses.createGain(), f = ses.createBiquadFilter();
    f.type = 'bandpass'; f.frequency.value = 2400 * kat; f.Q.value = 2;
    g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
    for (const fr of [540, 800]) {
      const o = ses.createOscillator(); o.type = 'square'; o.frequency.value = fr * kat;
      o.connect(f); o.start(t); o.stop(t + 0.2);
    }
    f.connect(g).connect(ana);
  };
  const melodi = [1, 1, 1.19, 1, 0.89, 1, 1.19, 1.33, 1, 1, 1.19, 1, 0.89, 0.84, 0.89, 1];
  melodi.forEach((kat, i) => {
    const t = t0 + i * adim;
    cowbell(t, kat);
    if (i % 4 === 0 || i === 10) kick(t);
  });
}

// ------------------------------------------------------------ kediler
function kediDongusu() {
  setTimeout(function yuru() {
    if (!ebeveyn) {
      const k = document.createElement('div');
      k.className = 'yuruyen-kedi';
      k.innerHTML = `🐈<span>${rastgele(['mrrp', 'meow?', 'is it scary yet', 'pspsps', 'nya', 'so tuff'])}</span>`;
      $('sahne').append(k);
      setTimeout(() => k.remove(), 9200);
    }
    setTimeout(yuru, 70000 + Math.random() * 60000);
  }, 15000);
  // Kedinin yorumlarini yalnizca host atar ki herkes ayni seyi gorsun.
  if (HOST_MU) setInterval(() => {
    if (izleyiciler.size) herkese({ tur: 'sistem', kedi: true, metin: rastgele(P.kedi) });
  }, 6 * 60 * 1000);
}

// ------------------------------------------------------------ emoji ve yazma
function emojileriKur() {
  const kutu = $('emojiler');
  for (const e of Array.from(new Intl.Segmenter().segment(EMOJI), (s) => s.segment)) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = e;
    b.onclick = () => {
      const g = $('metin'), bas = g.selectionStart ?? g.value.length;
      g.value = g.value.slice(0, bas) + e + g.value.slice(g.selectionEnd ?? bas);
      g.focus(); g.selectionStart = g.selectionEnd = bas + e.length;
    };
    kutu.append(b);
  }
  $('emoji-ac').onclick = () => kutu.classList.toggle('gizli');
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#emojiler') && !e.target.closest('#emoji-ac')) kutu.classList.add('gizli');
  });
}

$('yaz').addEventListener('submit', (e) => {
  e.preventDefault();
  const metin = $('metin').value.trim().slice(0, 500);
  if (!metin) return;
  $('metin').value = '';
  $('emojiler').classList.add('gizli');
  if (HOST_MU) {
    herkese({ tur: 'mesaj', ad, metin });
    $('mesajlar').lastChild.classList.add('ben');
  } else if (hostBaglanti && hostBaglanti.open) {
    hostBaglanti.send({ tur: 'mesaj', metin });
    mesajEkle({ tur: 'mesaj', ad, metin, ben: true });
  } else {
    $('metin').value = metin;   // kaybolmasin, baglaninca gonderilir
    bagliDegil();
  }
});

// Tiyatro: telefon yan cevrilince kendiliginden; Fullscreen dugmesiyle elle.
// iPhone'da gercek tam ekran yalnizca videoyu gosteriyor (efekt ve sohbet
// kayboluyordu): orada tam ekran yerine ayni gorunum sayfanin icinde.
const yanEkran = matchMedia('(orientation: landscape) and (max-height: 520px)');
let elleTiyatro = false;
function tiyatroGuncelle() {
  const ac = !!document.fullscreenElement || elleTiyatro || yanEkran.matches;
  $('oda').classList.toggle('tiyatro', ac);
  if (!ac) $('oda').classList.remove('sohbet-acik');
  $('tiyatro-cik').classList.toggle('gizli', yanEkran.matches && !document.fullscreenElement && !elleTiyatro);
}
yanEkran.addEventListener('change', tiyatroGuncelle);
$('tamekran').onclick = async () => {
  const oda = $('oda');
  if (oda.requestFullscreen && document.fullscreenEnabled) {
    try { await oda.requestFullscreen(); return; } catch (_) {}
  }
  elleTiyatro = true;
  tiyatroGuncelle();
};
$('tiyatro-cik').onclick = async () => {
  if (document.fullscreenElement) await document.exitFullscreen();
  elleTiyatro = false;
  tiyatroGuncelle();
};
$('sohbet-ac').onclick = () => {
  const acik = $('oda').classList.toggle('sohbet-acik');
  if (acik) { okunmamis = 0; $('okunmamis').classList.add('gizli'); const k = $('mesajlar'); k.scrollTop = k.scrollHeight; }
};
document.addEventListener('fullscreenchange', tiyatroGuncelle);

// Film sirasinda telefonun ekrani kararmasin.
let uyanik = null;
async function ekranUyanik(ac) {
  try {
    if (ac && !uyanik && 'wakeLock' in navigator) {
      uyanik = await navigator.wakeLock.request('screen');
      uyanik.addEventListener('release', () => { uyanik = null; });
    } else if (!ac && uyanik) {
      await uyanik.release();
      uyanik = null;
    }
  } catch (_) {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && $('video').srcObject) ekranUyanik(true);
});
document.addEventListener('click', sesHazirla, { once: true });

window.addEventListener('beforeunload', () => { try { peer && peer.destroy(); } catch (_) {} });
tanimaOyna();
</script>
